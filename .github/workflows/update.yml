name: update-fairs

# 매주 월요일 새벽 3시(KST) = 일요일 18:00 UTC 에 CPAAD 공개 일정 페이지를 읽어 data/fairs.json 을 갱신한다.
# 내용이 바뀐 때만 커밋하고, GitHub Pages(wedding.imeji.com)가 그 파일을 공개한다.
# GitHub 크론은 몇 분~수십 분 늦거나 건너뛸 수 있어 월요일 새벽 한 번 더(보충) 돌린다.
on:
  schedule:
    - cron: '0 18 * * 0'     # 월 03:00 KST
    - cron: '30 21 * * 0'    # 월 06:30 KST (보충)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fairs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/fairs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fairs.json
            git commit -m "update fairs $(date -u +%F)"
            git push
          else
            echo "no changes"
          fi
